<h1>我的待办事项</h1>
<ul id="list"></ul>
<input type="text" id="todoInput" placeholder="输入待办事项">
<button id="btn">添加待办事项</button>

<script>
    const todos = JSON.parse(localStorage.getItem("todos")) || [];
    const btn = document.getElementById("btn");
    const todoInput = document.getElementById("todoInput");
    const list = document.getElementById("list");

    btn.addEventListener("click", function () {
        if (todoInput.value === "") {
            alert("请输入待办事项");
            return;
        }
        todos.push({ text: todoInput.value, done: false });
        todoInput.value = "";
        save();
        render();
    });

    todoInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            btn.click();
        }
    });

    function render() {
        list.innerHTML = "";
        for (let i = 0; i < todos.length; i++) {
            const style = todos[i].done ? "text-decoration: line-through; color: gray;" : "";
            list.innerHTML +=
                "<li>" +
                "<span style='" + style + "' onclick='toggleTodo(" + i + ")'>" + todos[i].text + "</span>" +
                " <button onclick='removeTodo(" + i + ")'>删除</button>" +
                "</li>";
        }
    }

    function save() {
        localStorage.setItem("todos", JSON.stringify(todos));
    }

    function removeTodo(index) {
        todos.splice(index, 1);
        save();
        render();
    }

    render();
</script>
