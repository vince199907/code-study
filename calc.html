<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>我的计算器</title>
    <style>
      body { font-family: sans-serif; max-width: 400px; margin: 40px auto; }
      input { width: 80px; padding: 6px; font-size: 16px; }
      button { padding: 6px 14px; font-size: 16px; }
      #result { font-size: 24px; margin-top: 20px; }
      div { margin-bottom: 12px; }
      span { font-size: 20px; margin-left: 8px; }
    </style>
  </head>
  <body>
    <h1>计算器</h1>
    <h2>加法</h2>
    <div>
        <input id="a" type="number"> +
        <input id="b" type="number">
        <button id="btn">=</button>
        <span id="result"></span>
    </div>
    <h2>减法</h2>
    <div>
        <input id="c" type="number">-
        <input id="d" type="number">
        <button id="btn2">=</button>
        <span id="result2"></span>
    </div>
    <h2>乘法</h2>
    <div>
        <input id="e" type="number"> *
        <input id="f" type="number">
        <button id="btn3">=</button>
        <span id="result3"></span>
    </div>
    <h2>除法</h2>
    <div>
        <input id="g" type="number"> /
        <input id="h" type="number">
        <button id="btn4">=</button>
        <span id="result4"></span>
    </div>

    <script>
    function setup(btnId, xId, yId, resultId, op) {
  const btn = document.getElementById(btnId);
  const result = document.getElementById(resultId);

  btn.addEventListener("click", function () {
    const x = Number(document.getElementById(xId).value);
    const y = Number(document.getElementById(yId).value);

    if (op === "+") result.textContent = x + y;
    if (op === "-") result.textContent = x - y;
    if (op === "*") result.textContent = x * y;
    if (op === "/") {
      result.textContent = y === 0 ? "不能除以 0" : x / y;
    }
  });
}

setup("btn",  "a", "b", "result",  "+");
setup("btn2", "c", "d", "result2", "-");
setup("btn3", "e", "f", "result3", "*");
setup("btn4", "g", "h", "result4", "/");
    </script>
  </body>
</html>
